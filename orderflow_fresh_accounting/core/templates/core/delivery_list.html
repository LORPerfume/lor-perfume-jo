{% extends 'core/base.html' %}{% block page_title %}شركات التوصيل{% endblock %}{% block content %}<section class="panel"><div class="bar"><a class="btn primary" href="{% url 'delivery_create' %}">+ شركة توصيل</a></div><table><thead><tr><th>الشركة</th><th>الهاتف</th><th>الأجرة</th><th>فعال</th></tr></thead><tbody>{% for c in companies %}<tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.default_fee }}</td><td>{{ c.is_active }}</td></tr>{% empty %}<tr><td colspan="4">لا توجد شركات</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
