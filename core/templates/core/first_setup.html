<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إعداد النظام</title><style>body{font-family:Arial;background:#f4eee5;display:grid;place-items:center;height:100vh}form{background:#fff;padding:30px;border-radius:18px;border:1px solid #e2d5c4;width:360px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{background:#18202a;color:white;border:0;padding:12px 18px;border-radius:10px}.err{color:#b00020}</style></head><body><form method="post">{% csrf_token %}<h2>إعداد النظام لأول مرة</h2>{% if error %}<p class="err">{{ error }}</p>{% endif %}<label>اسم المستخدم</label><input name="username" required><label>كلمة المرور</label><input type="password" name="password1" required><label>تأكيد كلمة المرور</label><input type="password" name="password2" required><button>إنشاء المدير</button></form></body></html>
