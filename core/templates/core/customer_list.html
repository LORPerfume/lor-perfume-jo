{% extends 'core/base.html' %}{% block page_title %}إدارة العملاء{% endblock %}{% block content %}<section class="panel"><div class="section-head"><h3>العملاء</h3><a class="btn btn-dark" href="{% url 'customer_create' %}">إضافة عميل</a></div><form class="filters"><input name="q" value="{{ q }}" placeholder="بحث بالاسم، الهاتف، المدينة، الوسوم"><button class="btn btn-outline-dark">بحث</button></form><div class="table-responsive"><table class="table"><thead><tr><th>الاسم</th><th>الهاتف</th><th>المدينة</th><th>المنطقة</th><th>المصدر</th><th></th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.city }}</td><td>{{ c.area }}</td><td>{{ c.source }}</td><td><a href="{% url 'customer_edit' c.id %}">تعديل</a></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
