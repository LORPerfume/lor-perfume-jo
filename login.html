<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body{font-family:Tahoma,Arial;background:#f3f4f6;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
        .box{background:white;padding:30px;border-radius:16px;box-shadow:0 10px 30px #0001;width:360px}
        input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
        button{width:100%;padding:12px;background:#111827;color:white;border:0;border-radius:10px;margin-top:10px}
    </style>
</head>
<body>
<div class="box">
    <h2>تسجيل الدخول</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">دخول</button>
    </form>
</div>
</body>
</html>
