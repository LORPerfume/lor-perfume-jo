<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LOR Perfume</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
}

/* HEADER */
header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 22px;
    letter-spacing: 2px;
}

/* PRODUCT CARD */
.container {
    display: flex;
    justify-content: center;
    padding: 40px;
}

.card {
    background: white;
    width: 320px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
}

.card img {
    width: 100%;
    height: 320px;
    object-fit: cover;
}

.card h2 {
    margin: 15px 0 5px;
}

.price {
    font-size: 18px;
    color: #777;
    margin-bottom: 10px;
}

/* STRIKED PRICE REMOVED (35$ حذفناها بالكامل) */

.btn {
    display: inline-block;
    margin: 15px 0 25px;
    padding: 12px 25px;
    background: black;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    transition: 0.3s;
}

.btn:hover {
    background: #333;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    color: #999;
    font-size: 13px;
}
</style>

</head>
<body>

<header>
    LOR PERFUME
</header>

<div class="container">
    <div class="card">

        <!-- غيّر رابط الصورة هون -->
        <img src="your-image.jpg" alt="Perfume">

        <h2>Luxury Butter Perfume</h2>

        <div class="price">
            50 ML Eau de Parfum
        </div>

        <!-- زر Buy Now -->
        <a class="btn" href="https://wa.me/000000000" target="_blank">
            BUY NOW
        </a>

    </div>
</div>

<footer>
    © 2026 LOR PERFUME. All rights reserved.
</footer>

</body>
</html>
