<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOR Perfume Luxury</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top,#0e0e0e,#000);
  color:white;
  scroll-behavior:smooth;
  overflow-x:hidden;
}

#loader{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#loader img{
  width:90px;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:.5;}
  50%{transform:scale(1.2);opacity:1;}
  100%{transform:scale(1);opacity:.5;}
}
#loader.hide{
  opacity:0;
  pointer-events:none;
  transition:.6s;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  box-sizing:border-box;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(15px);
  z-index:1000;
}

.nav{
  display:flex;
  gap:10px;
  align-items:center;
  margin-right:25px;
}

.nav a{
  color:white;
  text-decoration:none;
  font-size:13px;
  padding:8px 12px;
  border-radius:6px;
  transition:.3s;
  white-space:nowrap;
}

.nav a:hover{
  background:#d4af37;
  color:black;
}

.buy{
  background:#d4af37;
  color:black !important;
  font-weight:bold;
  padding:8px 14px !important;
  border-radius:8px;
}

.right{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:45px;
  border-radius:10px;
}

.brand{
  font-size:13px;
  letter-spacing:2px;
}

.hero{
  text-align:center;
  padding:120px 20px 50px;
}

.glow{
  width:100px;
  height:2px;
  background:#d4af37;
  margin:15px auto;
}

.slider{
  width:90%;
  max-width:420px;
  margin:40px auto;
  overflow:hidden;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.1);
}

.slides{
  display:flex;
  transition:.5s;
}

.slides img{
  width:100%;
}

.product-text{
  text-align:center;
  padding:20px;
}

.badge{
  background:#d4af37;
  color:black;
  padding:5px 10px;
  font-size:11px;
  border-radius:6px;
}

.about{
  max-width:800px;
  margin:60px auto;
  padding:20px;
}

.about-card{
  background:rgba(255,255,255,.05);
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
}

.contact{
  background:black;
  text-align:center;
  padding:60px 20px;
}

.contact a{
  display:inline-block;
  margin:10px;
  padding:10px 15px;
  border-radius:8px;
  text-decoration:none;
  color:white;
}

.wa{background:#25D366;}
.insta{background:#E1306C;}
</style>
</head>
<body>

<div id="loader"><img src="logo.png"></div>

<div class="topbar">
  <div class="right">
    <img src="logo.png" class="logo">
    <div class="brand">LOR PERFUME</div>
  </div>

  <div class="nav">
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
    <a class="buy" href="https://wa.me/962787727783" target="_blank">Buy Now</a>
  </div>
</div>

<div class="hero">
  <h1>THE ART OF SCENT</h1>
  <div class="glow"></div>
  <p>Luxury fragrance experience beyond spraying</p>
</div>

<div class="slider">
  <div class="slides" id="slides">
    <img src="product.jpg">
    <img src="product.jpg">
    <img src="product.jpg">
  </div>
</div>

<div class="product-text">
  <span class="badge">NOT JUST A SPRAY</span>
  <h2>Luxury Butter Perfume</h2>
  <p>35 JD → <b style="color:#d4af37;">23 JD</b></p>
</div>

<div class="about" id="about">
  <div class="about-card">Vanilla Opening luxury scent</div>
  <div class="about-card">Butter heart notes elegance</div>
  <div class="about-card">Musk amber long lasting trail</div>
</div>

<div class="contact" id="contact">
  <h2>Contact Us</h2>
  <a class="wa" href="https://wa.me/962787727783">WhatsApp</a>
  <a class="insta" href="https://www.instagram.com/lorperfumejordan?igsh=ZnhpODdhNGZ0a3pw">Instagram</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const loader = document.getElementById("loader");
  setTimeout(()=>{
    loader.classList.add("hide");
    setTimeout(()=>loader.style.display="none",600);
  },1200);
});
</script>

</body>
</html>
