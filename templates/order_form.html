{% extends 'base.html' %}{% block content %}
<div class="card p-4"><h3 class="mb-3">إضافة طلب جديد</h3>
<form method="post" class="row g-3">
  <div class="col-md-4"><label class="form-label">اسم العميل</label><input name="customer_name" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label">الطلب</label><input name="order_text" class="form-control" required></div>
  <div class="col-md-2"><label class="form-label">السعر</label><input name="price" type="number" step="0.01" class="form-control" required></div>
  <div class="col-md-2"><label class="form-label">الكمية</label><input name="quantity" type="number" value="1" min="1" class="form-control"></div>
  <div class="col-md-3"><label class="form-label">ربط بمنتج من المستودع</label><select name="product_id" class="form-select"><option value="">بدون ربط</option>{% for p in products %}<option value="{{p.id}}">{{p.name}} - متوفر {{p.quantity}}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label class="form-label">حالة الطلب</label><select name="status" class="form-select">{% for s in statuses %}<option>{{s}}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label class="form-label">طريقة الدفع</label><select name="payment_method" class="form-select">{% for p in payments %}<option>{{p}}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label class="form-label">شركة التوصيل</label><select name="delivery_company_id" class="form-select"><option value="">بدون</option>{% for c in companies %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label">ملاحظات</label><textarea name="notes" class="form-control"></textarea></div>
  <div class="col-12"><button class="btn btn-primary">حفظ الطلب</button></div>
</form></div>
{% endblock %}
