<div class="card p-3"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>#</th><th>التاريخ</th><th>العميل</th><th>الطلب</th><th>منتج</th><th>السعر</th><th>الدفع</th><th>شركة التوصيل</th><th>الحالة</th><th>تغيير الحالة</th></tr></thead><tbody>{% for o in orders %}<tr><td>{{o.id}}</td><td>{{o.created_at[:10]}}</td><td>{{o.customer_name}}</td><td>{{o.order_text}}</td><td>{{o.product_name or '-'}}</td><td>{{o.price|money}}</td><td>{{o.payment_method}}</td><td>{{o.delivery_name or '-'}}</td><td><span class="badge text-bg-info">{{o.status}}</span></td><td><form method="post" action="{{ url_for('change_status', order_id=o.id) }}" class="d-flex gap-2"><select name="status" class="form-select form-select-sm">{% for s in statuses %}<option {% if o.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button class="btn btn-sm btn-primary">حفظ</button></form></td></tr>{% else %}<tr><td colspan="10" class="text-center text-muted">لا يوجد طلبات.</td></tr>{% endfor %}</tbody></table></div></div>
