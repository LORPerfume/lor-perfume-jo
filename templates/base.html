<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOR | نظام الطلبات والمستودع</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">LOR</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('new_order') }}">إضافة طلب</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('today_orders') }}">طلبات اليوم</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('all_orders') }}">كل الطلبات</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('delivery') }}">شركات التوصيل</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('inventory') }}">المستودع</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('returns') }}">المرتجعات</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('reports') }}">التقارير</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container-fluid px-4">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}<div class="alert alert-success">{{ msg }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
