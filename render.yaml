services:
  - type: web
    name: sarh-enterprise-order-system
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn order_system.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: sarh-enterprise-db
          property: connectionString

databases:
  - name: sarh-enterprise-db
    plan: free
