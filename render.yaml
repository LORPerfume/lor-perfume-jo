services:
  - type: web
    name: orderflow
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn orderflow.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
