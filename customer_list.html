{% extends 'core/base.html' %}
{% block content %}
<h1>العملاء</h1>
<form method="get" class="search">
    <input type="text" name="q" value="{{ q }}" placeholder="بحث بالاسم أو الهاتف أو المدينة">
    <button>بحث</button>
    <a class="btn" href="/customers/new/">إضافة عميل</a>
</form>
<table>
    <tr><th>الاسم</th><th>الهاتف</th><th>المدينة</th><th>المنطقة</th><th>تاريخ الإدخال</th></tr>
    {% for c in customers %}
    <tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.city }}</td><td>{{ c.area }}</td><td>{{ c.created_at|date:"Y-m-d" }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
